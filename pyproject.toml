[project]
name = "docfit-v3"
version = "0.1.0"
description = "DocFit eval-harness-first DOCX conversion prototype."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "python-docx>=1.1.2",
  "pyyaml>=6.0.2",
  "typer>=0.12.5",
]

[project.scripts]
docfit = "docfit.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
