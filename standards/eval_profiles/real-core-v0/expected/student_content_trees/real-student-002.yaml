    \ HYDROCARBON-CONTAMINATED SOIL AND ITS TECHNICAL PARAMETERS\n\n## 应忽略的 donor-school\
    \ 或模板自带前置页\n\n```text\n无。\n```\n\n## 中文摘要\n\n存在中文摘要。标题为“摘要”。正文应由下面 1 段组成：\n\n\
    1. 多环芳烃（PAHs）是化工场地土壤中广泛检出的一类具有“致畸、致癌、致突变”效应的持久性有机污染物，其与土壤有机质的强结合作用导致残留态PAHs生物可利用性低、降解困难，且传统物理化学修复技术易破坏土壤生态-生产功能。本研究面向化工场地PAHs污染土壤的原位绿色修复需求，构建了由6株PAHs降解菌（涵盖低、中、高分子量PAHs降解菌）和3株植物促生菌组成的复合菌群，优化了菌群复配比例、施加时间及固定化载体类型，通过液体摇瓶实验、土壤培养实验和空心菜盆栽实验，系统考察了固定化菌剂对16种PAHs的去除效能、对植物生长的影响及对土壤理化性质的调控作用，并探讨了载体-微生物协同增效机制。主要结果如下：复合菌群最佳复配比例为1:20（v:v），48h内对液体中总PAHs去除率达68.67%，其中低分子量PAHs在12h内快速降解，中高分子量PAHs需更长时间；四种生物质载体中稻壳和玉米芯粉对PAHs的吸附效果最佳，将菌群固定于玉米芯粉后，对土壤中中分子量PAHs（87.55%）和高分子量PAHs（64.30%）的去除率显著高于单独载体或游离菌，45d后S-XF组对总PAHs去除率保持最高，证实了“吸附-富集-降解”级联协同效应；S-XF处理使空心菜株高较对照提高105.6%，污染物去除率与植物生长指标呈显著正相关；修复过程中土壤pH保持稳定（7.46–8.05），外源碳载体短期提升有机质和阳离子交换量，但45d后有机质基本恢复至对照水平，活性菌群的存在会削弱载体对阳离子交换量的提升作用，总体未对土壤造成不可逆的理化性质破坏。本研究提出的玉米芯粉固定化复合菌群修复工艺兼顾了污染物高效去除与土壤生态功能恢复，为化工场地PAHs污染土壤的绿色可持续原位修复提供了技术支撑和理论依据。\n\
    \n## 中文关键词\n\n按原顺序：\n\n1. 多环芳烃\n2. 污染土壤\n3. 微生物组协同修复\n4. 固定化菌剂\n5. 共代谢\n\n## 英文摘要\n\
    \n存在英文摘要。英文题名位于英文摘要标题前；标题原文疑似写作 `ABSRTACT`，系统可按模板标题规范化为 `ABSTRACT`。正文应由下面 1 段组成：\n\
    \n- 英文题名：A STUDY ON MICROBIAL CONSORTIUM-MEDIATED REMEDIATION OF POLYCYCLIC AROMATIC\
    \ HYDROCARBON-CONTAMINATED SOIL AND ITS TECHNICAL PARAMETERS\n\n1. Polycyclic\
    \ aromatic hydrocarbons (PAHs) are a class of persistent organic pollutants widely\
    \ detected in the soil of chemical industrial sites that exhibit teratogenic,\
    \ carcinogenic, and mutagenic effects. Their strong binding to soil organic matter\
    \ results in low bioavailability and difficult degradation of residual PAHs, and\
    \ traditional physicochemical remediation techniques often disrupt the soil’s\
    \ ecological and productive functions. This study addressed the need for in-situ\
    \ green remediation of PAH-contaminated soil at chemical sites by constructing\
    \ a composite microbial consortium comprising six PAH-degrading bacteria (covering\
    \ low-, medium-, and high-molecular-weight PAH-degrading strains) and three plant-promoting\
    \ bacteria. The optimal ratios of the microbial consortium, application timing,\
    \ and types of immobilization carriers were determined. Through liquid shake flask\
    \ experiments, soil cultivation experiments, and water spinach pot experiments,\
    \ the study systematically investigated the removal efficiency of the immobilized\
    \ microbial agent for 16 types of PAHs, its impact on plant growth, and its regulatory\
    \ effects on soil physicochemical properties, while also exploring the synergistic\
    \ mechanism between the carrier and microorganisms. The main results are as follows:\
    \ The optimal formulation ratio for the composite microbial consortium was 1:20\
    \ (v:v), achieving a total PAH removal rate of 68.67% in liquid within 48 hours.\
    \ Among these, low-molecular-weight PAHs degraded rapidly within 12 hours, while\
    \ medium- and high-molecular-weight PAHs required a longer time; Among the four\
    \ biomass carriers, rice husks and corn cob powder exhibited the best adsorption\
    \ performance for PAHs. When the microbial consortium was immobilized on corn\
    \ cob powder, the removal rates of medium-molecular-weight PAHs (87.55%) and high-molecular-weight\
    \ PAHs (64.30%) in soil were significantly higher than those of the carriers alone\
    \ or free-living bacteria; After 45 days, the S-XF group maintained the highest\
    \ removal rate for total PAHs, confirming the “adsorption-enrichment-degradation”\
    \ cascade synergistic effect; S-XF treatment increased the plant height of water\
    \ spinach by 105.6% compared to the control, and pollutant removal rates showed\
    \ a significant positive correlation with plant growth indices; Soil pH remained\
    \ stable (7.46–8.05) throughout the remediation process. The exogenous carbon\
    \ carrier temporarily increased organic matter and cation exchange capacity, but\
    \ organic matter levels largely returned to control levels after 45 days. The\
    \ presence of active microbial communities attenuated the carrier’s effect on\
    \ cation exchange capacity, and overall, no irreversible damage to the soil’s\
    \ physicochemical properties was observed. The immobilized composite microbial\
    \ community remediation process using corn cob powder proposed in this study balances\
    \ the efficient removal of pollutants with the restoration of soil ecological\
    \ functions, providing technical support and theoretical basis for the green and\
    \ sustainable in-situ remediation of PAH-contaminated soils at chemical industrial\
    \ sites.\n\n## 英文关键词\n\n按原顺序：\n\n1. Polycyclic aromatic hydrocarbons\n2. contaminated\
    \ soil\n3. microbial consortium-mediated remediation\n4. immobilized microbial\
    \ agents\n5. co-metabolism\n\n## 正文标题结构（不是原稿目录）\n\n```text\nlevel 1: 文献综述\n  level\
    \ 2: 化工场地土壤PAHs污染特征与生态风险\n    level 3: 化工场地PAHs污染现状\n    level 3: 不同分子量PAHs在土壤中的赋存行为差异\n\
    \  level 2: PAHs的微生物降解途径与代谢机理\nlevel 1: 土壤多环芳烃微生物组转化工艺技术条件\n  level 2: 材料与方法\n\
    \    level 3: 菌株、培养基与试剂\n  level 2: 结果与分析\n    level 3: 菌群复配比例和反应条件优化及固定化载体选择\n\
    level 1: 结论与展望\n  level 2: 结论\n  level 2: 展望\n```\n\n## 正文段落顺序\n\n```text\n1.\
    \ level 1: 文献综述\n2. level 2: 化工场地土壤PAHs污染特征与生态风险\n3. level 3: 化工场地PAHs污染现状\n4.\
    \ paragraph: 近些年来，随着城市化进程加速和工业企业搬迁，遗留了大量污染场地，其中多环芳烃（PAHs）是一类广泛检出的具有“致畸、致癌、致突变”效应的有毒有机污染物。化工场地的PAHs污染具有浓度高、深度大、形态复杂等特点。对某一废弃化工厂场地土壤的垂直剖面调查发现，PAHs总残留含量在2.64m和5.76m深度处分别高达1622.13mg/kg和1665.65mg/kg，主要以有机可溶态存在，且低分子量（LMW-PAHs）和中分子量（MMW-PAHs）PAHs占主导地位。在污染场地中，超过90%的结合态LMW-PAHs和MMW-PAHs赋存于胡敏素中，而23.1%~47.2%的高分子量PAHs（HMW-PAHs）与富里酸和胡敏酸结合[1]。PAHs与土壤有机质的结合过程抑制了PAHs降解菌和降解基因在场地土壤中的丰度增加，导致深层污染土壤中PAHs残留难以被生物降解，存在较高的环境和健康风险[2]。\n\
    5. level 3: 不同分子量PAHs在土壤中的赋存行为差异\n6. paragraph: 不同分子量的PAHs在土壤中的赋存行为存在显著差异，主要受其物理化学性质如辛醇-水分配系数LogKow、水溶性Sw和土壤有机质组成的影响。LMW-PAHs（如萘、菲）具有较高的水溶性和挥发性，在土壤中更易发生挥发和迁移，其挥发量与老化时间呈线性关系（R²=0.88~0.98），而MMW-PAHs和HMW-PAHs在土壤中具有更高的残留率。在土壤老化过程中，HMW-PAHs更易与土壤腐殖质结合形成结合态残留，在低有机碳含量的土壤中，结合态转化率顺序为HMW-PAHs>MMW-PAHs>LMW-PAHs。吸附实验表明，PAHs的土壤有机碳归一化分配系数LogKoc是决定其在土壤中平衡分配系数Kd的最关键因素，两者存在显著线性关系（R2=0.79~0.93）。此外，溶解性有机质（DOM）与PAHs及其衍生物的结合作用研究表明，官能团取代会抑制DOM与PAHs的结合，从而改变PAHs衍生物在土壤环境中的迁移能力。\n\
    7. level 2: PAHs的微生物降解途径与代谢机理\n8. level 1: 土壤多环芳烃微生物组转化工艺技术条件\n9. paragraph: 本章围绕化工场地多环芳烃污染土壤的微生物组协同修复工艺开展系统的实验研究，内容涵盖复合菌群构建、降解条件优化、固定化载体筛选及修复效能验证。以课题组前期筛选获得的PAHs降解菌与市售促生菌为材料构建复合菌群，优化其复配比例与施加时间，并筛选适宜的生物质固定化载体。采用吸附法制备固定化菌剂，通过土壤培养实验考察其对16种PAHs的去除效能，同时利用空心菜盆栽实验评估修复过程对植物生长的影响。在此基础上，系统测定修复前后土壤pH、有机质、水溶性盐及阳离子交换量等理化指标，阐明微生物修复对土壤生态功能的作用。本章研究旨在确定最佳的固定化工艺参数与固定化载体筛选，揭示载体-微生物协同增效机制，为化工场地PAHs污染土壤的绿色原位修复提供数据支撑和技术依据。\n\
    10. level 2: 材料与方法\n11. level 3: 菌株、培养基与试剂\n12. paragraph: 菲、苊烯降解菌IOCCSR-10010\
    \ Diaphorobactersp. Phe15和IOCCSR-10011 Mycolicibacteriumsp. Pyr9；芘、蒽、荧蒽降解菌IOCCSR-10001\
    \ Mycobacterium flavescens(ATCC®700033™)以及苯并芘降解菌IOCCSR-10013 Altererythrobacter\
    \ epoxidivorans.sp和IOCCSR-10017 Meyerozyma guilliermondii.sp均为课题组前期工作筛选纯化得到；促生菌ACCC60428\
    \ Bacillusamyloliquefaciens、ACCC19468 Paenibacillus barcinonensis和ACCC19743 Bacillussubtilis购自中国农业微生物菌种保藏管理中心。\n\
    13. paragraph: 实验所用16种多环芳烃的性质如下表1所示，均购自上海阿拉丁生化科技股份有限公司；邻菲啰啉（C12H8N2·H2O，≥99%）、重铬酸钾（K2Cr2O7，≥99%）、乙酸铵(C2H7NO2,≥99%)购自国药集团化学试剂有限公司；浓硫酸（H2SO4，≥98%）、浓盐酸（HCl，≥99%）、无水硫酸钠（Na2SO4，≥99%）、甲醇（CH3OH,≥99.5%，色谱纯）、二氯甲烷（CH2Cl2，≥99.5%，色谱纯）、正己烷（CH3（CH2）4CH3,≥99.5%，色谱纯）、丙酮（CH3COCH3,≥99.5%，色谱纯）购自南京化学试剂有限公司。\n\
    14. table 1: 16种多环芳烃及其基本理化性质；16 Polycyclic Aromatic Hydrocarbons and Their Basic\
    \ Physical and Chemical Properties；17 行 x 5 列：第1行 PAHs | 环数 | 分子量(g/mol) | 水溶解度(mg/L,25°C)\
    \ | logKow(亲疏水性)；第2行 萘（Nap） | 2 | 128.17 | 31 | 3.37；第3行 苊烯（Any） | 3 | 152.2 |\
    \ 16.1 | 4.07；第4行 苊（Ace） | 3 | 154.21 | 3.93 | 3.98；第5行 芴（Flu） | 3 | 166.22 |\
    \ 1.98 | 4.18；第6行 菲（Phe） | 3 | 178.23 | 1.15 | 4.57；第7行 蒽（Ant） | 3 | 178.23 |\
    \ 0.045 | 4.54；第8行 荧蒽（Fla） | 4 | 202.26 | 0.26 | 5.22；第9行 芘（Pyr） | 4 | 202.26\
    \ | 0.132 | 5.18；第10行 苯并[a]蒽（BaA） | 4 | 228.29 | 0.011 | 5.91；第11行 䓛（Chr） | 4\
    \ | 228.29 | 0.002 | 5.86；第12行 苯并[b]荧蒽（BbF） | 5 | 252.32 | 0.0015 | 6.04；第13行\
    \ 苯并[k]荧蒽（BkF） | 5 | 252.32 | 0.0008 | 6.11；第14行 苯并[a]芘（BaP） | 5 | 252.32 | 0.0038\
