expected:
  unit_order:
    - cover
    - integrity_statement
    - toc
    - body_title_block
    - abstract_cn
    - abstract_en
    - body_main
    - references
    - acknowledgement
    - appendix
    - design_task
    - proposal
    - proposal_record
    - defense_record
    - topic_change_approval
    - grade_form
  policy_groups:
    fixed_units:
      - cover
    fixed_units_allow_fill_elements:
      - cover
    manual_only_units:
      - integrity_statement
      - design_task
      - proposal
      - proposal_record
      - defense_record
      - topic_change_approval
      - grade_form
    fill_units:
      - body_title_block
      - abstract_cn
      - abstract_en
      - body_main
      - references
    generated_units:
      - toc
    template_default_optional_units:
      - acknowledgement
      - appendix
  element_policy_contract:
    artifact_type: element_spec
    allowed_policies:
      - fixed
      - template_default
      - fill
      - manual_only
      - generated
      - instruction_remove
    required_fields_by_policy:
      fill:
        - fill_source
        - source_refs
        - source_seq_refs
      manual_only:
        - manual_semantics
        - source_refs
        - source_seq_refs
      generated:
        - generated.field_type
        - source_refs
      instruction_remove:
        - source_refs
        - source_seq_refs
    unit_boundary_policy:
      source_unit_order_must_match_t2: true
      manual_only_units_must_not_materialize_fill_slots: true
      generated_units_must_declare_field_type: true
      instruction_text_must_be_instruction_remove_or_fixed_evidence: true
    notes:
      - 湖南农大后置设计任务书、开题、答辩、变更和成绩表按人工填写表单处理。
      - 封面是固定模板块，但题名、学生信息等明确填空位允许生成 fill 元素。
      - 致谢和附录是模板默认可选单元；没有学生内容时不得强制生成正文 slot。
  run_level_elements:
    - unit_id: cover
      source_seq: 6
      description: 中文题目占位与段内格式说明必须拆成 run 级 element
      expected_elements:
        - policy: fixed
          content_contains: 毕业论文（设计）中文题目
          raw_run_ids:
            - p_0007.r_002
            - p_0007.r_003
          logical_run_ids:
            - p_0007.lr_002
        - policy: instruction_remove
          raw_run_ids:
            - p_0007.r_004
          logical_run_ids:
            - p_0007.lr_003
