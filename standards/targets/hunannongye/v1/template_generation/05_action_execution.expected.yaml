  final_review_unit_order:
  - cover
  - integrity_statement
  - toc
  - body_title_block
  - abstract_cn
  - abstract_en
  - body_main
  - references
  - acknowledgement
  - appendix
  - design_task
  - proposal
  - proposal_record
  - defense_record
  - topic_change_approval
  - grade_form
  final_review_unit_summaries:
  - unit_id: cover
    order: 1
    name: 封面
    status: required
    policy: fixed
    handling: 按固定模板块处理，可从源模板封面示例复制最终可见版面；不填任何封面字段；附件标题、括号格式说明和条件说明文字不进入最终输出。
    element_count: 7
    element_policies:
    - fill
    - fixed
    - manual_only
  - unit_id: integrity_statement
    order: 2
    name: 诚信声明
    status: manual_only
    policy: manual_only
    handling: 按固定模板块处理，可直接复制源模板诚信声明页；保留声明标题、正文、作者签名和日期空位，不自动填写签名和日期。
    element_count: 5
    element_policies:
    - manual_only
  - unit_id: toc
    order: 3
    name: 目录
    status: required
    policy: fixed
    handling: 源模板目录是手写示例；目标输出可用 Word TOC 字段或等价目录生成机制生成目录；目录层级到 3 级。目录可跨多页；目录结束后，正文题名信息必须从下一页开始，不能接在目录最后一页空白处。
    element_count: 3
    element_policies:
    - fixed
    - generated
  - unit_id: body_title_block
    order: 4
    name: 正文题名信息
    status: required
    policy: fixed
    handling: 保留中文题名、学生、指导老师、学院/学校地址等可见信息段落；当前阶段不自动填这些字段；不要求源模板存在 content controls。
    element_count: 4
    element_policies:
    - fill
  - unit_id: abstract_cn
    order: 5
    name: 中文摘要
    status: required
    policy: fixed
    handling: 使用内嵌“摘  要：”标签和“关键词：”标签；填学生中文摘要和中文关键词；剥离源模板中的括号格式说明文字。
    element_count: 4
    element_policies:
    - fill
    - fixed
  - unit_id: abstract_en
    order: 6
    name: 英文摘要
    status: required
    policy: fixed
    handling: 保留英文题名、Student、Tutor、英文学院/学校地址、Abstract 和 Key words 标签；填学生英文摘要和英文关键词；剥离源模板中的括号格式说明文字。
    element_count: 8
    element_policies:
    - fill
    - fixed
  - unit_id: body_main
    order: 7
    name: 正文主体
    status: required
    policy: fixed
    handling: 按农理工类或文法经管类标题体系进入正文内容流；正文段落和标题按源模板规则处理；本校专属标准不定义图、表、公式的题名、编号、结构或样式。
    element_count: 12
    element_policies:
    - fill
    - fixed
  - unit_id: references
    order: 8
    name: 参考文献
    status: required
    policy: fixed
    handling: 保留标题“参考文献”；填参考文献条目。
    element_count: 2
    element_policies:
    - fill
    - fixed
  - unit_id: acknowledgement
    order: 9
    name: 致谢
    status: template_default_optional
    policy: template_default_optional
    handling: 草稿/审阅输出默认保留；填学生致谢；无内容时保留标题、占位和评论。
    element_count: 2
    element_policies:
    - fill
    - template_default_optional
  - unit_id: appendix
    order: 10
    name: 附录
    status: template_default_optional
    policy: template_default_optional
    handling: 源模板说明“没有附录的不标注”，但草稿/审阅输出可默认保留并提示学生确认；正式输出是否删除需人工确认。
    element_count: 2
    element_policies:
    - fill
    - template_default_optional
  - unit_id: design_task
    order: 11
    name: 毕业设计任务书
    status: manual_only
    policy: manual_only
    handling: 保留固定表单和填写说明；不自动填学生信息、课题来源勾选、进度安排、签名日期。
    element_count: 7
    element_policies:
    - manual_only
  - unit_id: proposal
    order: 12
    name: 开题报告
    status: manual_only
    policy: manual_only
    handling: 保留固定表单；不自动填文献综述、研究方案、论证小组意见、签名日期。
    element_count: 5
    element_policies:
    - manual_only
  - unit_id: proposal_record
    order: 13
    name: 开题论证记录表
    status: manual_only
    policy: manual_only
    handling: 保留固定记录表；不自动填写记录人、论证质疑、学生回答、签名日期。
    element_count: 4
    element_policies:
    - manual_only
  - unit_id: defense_record
    order: 14
    name: 答辩记录表
    status: manual_only
    policy: manual_only
    handling: 保留固定记录表；不自动填写答辩质疑、学生答辩记录、成员签名、日期。
    element_count: 4
    element_policies:
    - manual_only
  - unit_id: topic_change_approval
    order: 15
    name: 题目变更审批表
    status: manual_only
    policy: manual_only
    handling: 保留固定审批表；不自动填写变更前/后题目、变更原因、意见、签名日期。
    element_count: 4
    element_policies:
    - manual_only
  - unit_id: grade_form
    order: 16
    name: 成绩评定表
    status: manual_only
    policy: manual_only
    handling: 保留固定成绩评定表；不自动填写摘要、评语、成绩、委员会意见、签名日期。
    element_count: 102
    element_policies:
    - manual_only
