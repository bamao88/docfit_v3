      preserve_style_details: true
      preserve_run_boundaries: true
      preserve_table_structure: true
      preserve_section_rules: true
      preserve_header_footer_parts: true
      preserve_fields_and_numbering: true
      preserve_unknown_visible_objects: true
    notes:
      - T1 只读取并输出源 DOCX 事实；不得识别单元、策略或置信度。
      - 源模板中附件标题、说明文字、表格和页眉页脚均应作为可追溯事实保留，后续阶段再判断用途。
  forbidden_semantic_fields:
    - is_toc_entry
    - is_spacing_line
    - looks_like_instruction_text
    - likely_unit_heading
    - large_font
    - short_text
    - unit_id
    - policy
