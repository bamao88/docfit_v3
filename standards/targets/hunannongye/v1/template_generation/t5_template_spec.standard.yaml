scope:
  - template_spec_merge
  - unit_element_binding
  - unit_section_binding
  - source_trace_preservation
  - input_hash_binding
  - review_flag_preservation
expected:
  unit_order:
    - cover
    - integrity_statement
    - toc
    - body_title_block
    - abstract_cn
    - abstract_en
    - body_main
    - references
    - acknowledgement
    - appendix
    - design_task
    - proposal
    - proposal_record
    - defense_record
    - topic_change_approval
    - grade_form
  template_spec_contract:
    artifact_type: template_spec
    merge_inputs:
      - document_facts
      - unit_map
      - element_spec
      - global_spec
    required_input_hashes:
      - document_facts
      - unit_map
      - element_spec
      - global_spec
    must_preserve_unit_order: true
    unit_ids_must_be_unique_except_reviewed_other: true
    every_unit_must_have_section_profile_refs: true
    unit_section_refs_must_resolve_to_global_section_profiles: true
    unit_section_ranges_must_overlap_unit_source_seq_range: true
    fill_elements_must_preserve_fill_source: true
    review_flags_must_not_be_dropped: true
    no_word_action_execution: true
    downstream_owner_for_docx_build: T6
    notes:
      - T5 是模板解析主规格，不执行 Word 修改；可填模板构建动作归 T6。
      - 湖南农大后置表单必须在 template_spec 中保持独立 unit，不得并回正文或参考文献。
dimensions:
  - dimension_id: template_generation.t5.artifact_under_test
    required: true
    comparator_mode: exact
    expected_path: artifact_under_test
    actual_path: artifact_under_test
  - dimension_id: template_generation.t5.unit_order
    required: true
    comparator_mode: ordered_sequence
    expected_path: expected.unit_order
    actual_path: unit_order
  - dimension_id: template_generation.t5.legacy_compatibility
