    element_count: 5
    element_policies:
    - fill
    - fixed
  - unit_id: abstract_en
    order: 6
    name: 英文摘要
    status: required
    policy: fixed
    handling: 填英文题名、英文摘要、英文关键词；固定“ABSTRACT”和“KEY WORDS：/KEY WORDS:”标签。
    element_count: 5
    element_policies:
    - fill
    - fixed
  - unit_id: body_main
    order: 7
    name: 正文主体
    status: required
    policy: fixed
    handling: 按学校模板保留章、节、正文、图、表、公式等规则；包含固定类型结尾章“第X章 结论与展望”。
    element_count: 8
    element_policies:
    - fill
    - generated
  - unit_id: references
    order: 8
    name: 参考文献
    status: required
    policy: fixed
