scope:
  - template_spec_merge
  - unit_element_binding
  - unit_section_binding
  - source_trace_preservation
  - input_hash_binding
  - review_flag_preservation
expected:
  unit_order:
    - cover
    - originality_statement
    - authorization_statement
    - toc
    - abstract_cn
    - abstract_en
    - body_main
    - references
    - appendix
    - academic_achievements
    - acknowledgement
  template_spec_contract:
    artifact_type: template_spec
    merge_inputs:
      - document_facts
      - unit_map
      - element_spec
      - global_spec
    required_input_hashes:
      - document_facts
      - unit_map
      - element_spec
      - global_spec
    must_preserve_unit_order: true
    unit_ids_must_be_unique_except_reviewed_other: true
    every_unit_must_have_section_profile_refs: true
    unit_section_refs_must_resolve_to_global_section_profiles: true
    unit_section_ranges_must_overlap_unit_source_seq_range: true
    fill_elements_must_preserve_fill_source: true
    review_flags_must_not_be_dropped: true
    no_word_action_execution: true
    downstream_owner_for_docx_build: T6
    notes:
      - T5 是模板解析主规格，不执行 Word 修改；可填模板构建动作归 T6。
      - 南农本科声明页必须保持 fixed 边界，学术成果、附录和致谢不得丢失为 other。
dimensions:
  - dimension_id: template_generation.t5.artifact_under_test
