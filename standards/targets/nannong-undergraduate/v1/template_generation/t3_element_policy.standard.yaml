- generated_field_semantics
- instruction_cleanup
- element_source_trace
expected:
  unit_order:
  - cover
  - originality_statement
  - authorization_statement
  - toc
  - abstract_cn
  - abstract_en
  - body_main
  - references
  - appendix
  - academic_achievements
  - acknowledgement
  policy_groups:
    fixed_units:
    - cover
    fixed_units_allow_fill_elements:
    - cover
    manual_only_units:
    - originality_statement
    - authorization_statement
    fill_units:
    - abstract_cn
    - abstract_en
    - body_main
    - references
    generated_units:
    - toc
    template_default_optional_units:
    - appendix
    - academic_achievements
    - acknowledgement
  element_policy_contract:
    artifact_type: element_spec
    allowed_policies:
    - fixed
    - template_default
    - fill
    - manual_only
    - generated
    - instruction_remove
    required_fields_by_policy:
      fill:
      - fill_source
      - source_refs
      - source_seq_refs
      manual_only:
      - manual_semantics
      - source_refs
      - source_seq_refs
      generated:
      - generated.field_type
      - source_refs
      instruction_remove:
      - source_refs
      - source_seq_refs
    unit_boundary_policy:
      source_unit_order_must_match_t2: true
      manual_only_units_must_not_materialize_fill_slots: true
      generated_units_must_declare_field_type: true
      instruction_text_must_be_instruction_remove_or_fixed_evidence: true
    notes:
    - 南农本科原创性声明和授权声明为 manual_only；签名、日期和授权勾选不得自动填写。
    - 封面是固定模板块，但题名、学生信息等明确填空位允许生成 fill 元素。
    - 学术成果、附录和致谢为模板默认可选单元；没有学生内容时不得强制生成正文 slot。
