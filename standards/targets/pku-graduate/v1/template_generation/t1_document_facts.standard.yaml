      - metadata
      - body_flow
      - runs
      - data
      - indexes
      - warnings
    required_data_groups:
      - sections
      - headers_footers
      - fields
      - numbering_definitions
      - numbering_refs
      - images
      - tables
    locator_contract:
      source_seq_required_for_visible_body_flow: true
      source_ref_required_for_visible_body_flow: true
      part_name_required: true
      indexes_must_resolve_source_ref: true
      indexes_must_resolve_source_seq: true
    ooxml_fact_policy:
      preserve_visible_text: true
      preserve_style_details: true
      preserve_run_boundaries: true
      preserve_table_structure: true
      preserve_section_rules: true
      preserve_header_footer_parts: true
      preserve_fields_and_numbering: true
      preserve_unknown_visible_objects: true
    notes:
      - T1 只读取并输出源 DOCX 事实；不得识别单元、策略或置信度。
      - 源模板中的版权页、摘要、目录、图表目录、正文和原创授权页均只作为可追溯事实保留。
  forbidden_semantic_fields:
    - is_toc_entry
    - is_spacing_line
    - looks_like_instruction_text
    - likely_unit_heading
    - large_font
    - short_text
    - unit_id
    - policy
    - confidence
    - candidate_policy
    - fill_source
    - page_start
