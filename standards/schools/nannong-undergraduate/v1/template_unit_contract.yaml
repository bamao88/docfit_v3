    3. 全局规则（第三层级）\n================================================================================\n\
    \n3.1 页面、页眉、页脚与 Word section\n  页面：\n    - 纸张：A4。\n    - 上/下/左/右边距：20mm。\n   \
    \ - 装订线：5mm，居左。\n  页眉/页脚距离：\n    - 源模板可见说明写“页眉和页脚为 5mm”。\n    - 源模板 OOXML：封面附近\
    \ section 为页眉约 5mm、页脚约 5mm；正文及后置页多数 section 为页眉约 15mm、页脚约 17.5mm。\n    - 审查口径：记录为证据冲突。学校可见说明优先；如实现侧直接继承源\
    \ DOCX section，应单独标注这是模板 OOXML 实现值，不写成学校明示要求。\n  页眉内容归属：\n    - 全局只记录页眉机制和距离。\n\
    \    - 单元记录本单元显示什么页眉。\n    - 正文、参考文献、附录、成果目录、致谢页眉显示：南京农业大学本科毕业论文（设计）。\n    - 封面、声明、授权、目录、中英文摘要默认无页眉。\n\
    \  Word section 规则：\n    - 只在页眉/页脚/页码格式/页边距/横竖版变化时创建或切换 section。\n    - 新 section\
    \ 需要断开 Link to Previous，避免正文页眉或页码串到封面、声明、目录、摘要。\n    - 单元不是天然等于 Word section；单元只是声明需要的页面属性，渲染层再合并相邻相同属性。\n\
    \  判定（匹配 / 不匹配 / 不确定 / 不需要）：\n  备注：\n  \U0001F468 已修改：页眉/页脚距离从单纯采用 OOXML 改为“证据冲突”处理；源模板可见说明写\
    \ 5mm，OOXML 部分 section 为 15mm/17.5mm，学校明示要求优先。\n\n3.2 页码\n  归属：\n    - 页码格式、字体字号、起始编号和连续规则属于全局规则。\n\
    \    - 每个单元只声明使用哪一种页码规则。\n  页码显示：\n    - 封面：不显示页码。\n    - 原创性声明/使用授权声明：不显示页码。\n\
    \    - 目录、中英文摘要：前置页页码规则。\n    - 正文及后置页：阿拉伯数字页码规则。\n  前置页页码规则：\n    - 官方源模板存在罗马页码证据，页脚字段显示\
    \ I，目录示例显示 Ⅰ/Ⅱ。\n    - 当前 school.yaml 使用 lowerRoman；这里需人工确认最终采用大写罗马还是小写罗马。\n \
    \   - 在确认前，审查重点是“前置页使用罗马页码，且不与正文阿拉伯页码连续混用”。\n  正文及后置页页码规则：\n    - 从正文首页开始使用阿拉伯数字，起始页码为\
    \ 1。\n    - 参考文献、附录、相关的学术成果目录、致谢继续正文阿拉伯数字页码，不重新从 1 开始。\n    - 页码字体：Times New Roman；10.5pt（五号）；居中。\n\
    \  判定（匹配 / 不匹配 / 不确定 / 不需要）：\n  备注：\n  \U0001F468 无异议。前置页罗马页码与正文阿拉伯页码分层正确；原始 DOCX\
    \ 存在大小写/字段结果不完全一致的证据，因此保留人工确认大小写。\n\n3.3 正文基础样式（Normal / Body）\n  样式：中文宋体、英文/数字\
    \ Times New Roman；12pt（小四）；两端对齐；首行缩进 2 字符；段前=0；段后=0；行距=固定值 20pt。\n  依据：源模板 p75、p89。\n\
    \  判定（匹配 / 不匹配 / 不确定 / 不需要）：\n  备注：\n  \U0001F468 无异议。正文宋体/Times New Roman、小四、首行缩进\
    \ 2 字符、固定 20pt 行距与原始 DOCX 可见说明一致。\n\n3.4 标题样式与目录层级\n  章标题：\n    - 编号/文本：第X章 标题。\n\
    \    - 样式：黑体；16pt（三号）；居中；段前=24pt；段后=18pt；行距=固定值 20pt；大纲级别=1。\n  一级节标题：\n    -\
