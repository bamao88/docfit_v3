    \  判定（匹配 / 不匹配 / 不确定 / 不需要）：\n  备注：\n  \U0001F468 无异议。章标题、一级节标题、二级节标题和目录 1-3 级均与原始\
    \ DOCX 示例和 TOC 字段一致。\n\n3.5 摘要与关键词全局规则\n  中文摘要：\n    - 中文论文题名：黑体；18pt（小二）；居中。\n\
    \    - 摘要标题：黑体；16pt（三号）；居中。\n    - 摘要正文：宋体/Times New Roman；12pt；固定值 20pt；首行缩进\
