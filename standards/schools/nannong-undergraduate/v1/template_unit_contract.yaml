    - 元素顺序：单元内元素按列出顺序输出；如果该单元用于测试，需显式写出“元素顺序”。\n- 位置/排版关系：独立成段、同一段、同行、表格内部、页眉页脚等关系都属于审查项；未写同段关系时，默认该元素相对上一个元素换行并独立成段。\n\
    - 同页约束：如果一个单元或一组元素必须作为视觉整体留在同一页，应显式写出“同页约束”。这类约束高于普通换行关系，例如封面整体、声明签名区、图与图名、表名与表体等不能被\
