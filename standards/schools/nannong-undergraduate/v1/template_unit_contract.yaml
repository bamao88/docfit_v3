    - 类型=填充：从学生论文或元数据填入。\n- 类型=生成：由 Word 字段或系统生成。\n- 固定内容必须显式写出“内容”；固定签名/日期等表单项也要保留学校模板文字，只是不自动填写空白项。\n\
