    \   - KEY WORDS 标签：Times New Roman；14pt；加粗；与英文关键词内容同段。\n    - 英文关键词内容：Times New\
    \ Roman；12pt；分号分隔；最后不加标点。\n  判定（匹配 / 不匹配 / 不确定 / 不需要）：\n  备注：\n  \U0001F468 无异议。中英文摘要、关键词标签、字号、分号分隔和末尾不加标点均有原始\
    \ DOCX 可见说明。\n\n3.6 图、表、公式全局规则覆盖范围\n  图：\n    - 源模板明确：图应有中英文标题；居中；按章顺序编号；图中文字说明用\
    \ 5 号黑体，英文及数字为五号 Times New Roman。\n    - 示例核对：原始 DOCX 的媒体对象不属于正文图示例；正文区域没有真实图本体\
    \ + 图名示例。\n    - 源模板未明确：图题位置、中文/英文图题先后、图注是否必填、图题组同页规则。\n  表：\n    - 源模板明确：表格应有中英文标题；居中；按章顺序编号；图表内容一般为\
    \ 5 号及小 5 号宋体；表头用 5 号黑体，英文及数字为五号 Times New Roman。\n    - 示例核对：原始 DOCX 只有封面 1x1\
    \ 表格，没有正文表格示例。\n    - 源模板未明确：表题位置、中文/英文表题先后、表注是否必填、三线表边框、续表规则。\n  公式：\n    - 示例核对：原始\
    \ DOCX 正文区域没有 Word 公式对象或公式示例。\n    - 源模板只说明实验部分可包含公式；未提供公式编号、对齐、字体、正斜体或同页规则。\n\
    \  处理：\n    - 本校专属测试标准只记录源模板明示项；其他图表公式默认结构和样式放共享默认规则或人工确认。\n  判定（匹配 / 不匹配 / 不确定\
    \ / 不需要）：\n  备注：\n  \U0001F468 已修改：补充“先看原始 DOCX 是否有实际示例”的核对口径；南农正文没有图、表、公式实际示例，所以只记录源模板明示的图表中英文标题、居中、按章编号和部分字号。\n\
    \n3.7 参考文献全局规则\n  参考文献标题：黑体；16pt（三号）；居中；段前=24pt；段后=18pt；行距=固定值 20pt。\n  参考文献条目：中文宋体、英文/数字\
    \ Times New Roman；10.5pt（五号）；左对齐；行距=固定值 20pt。\n  编号：使用 [1] 形式，编号后保留空格。\n  著录规则：源模板说明遵照\
    \ GB/T 7714-2005。\n  判定（匹配 / 不匹配 / 不确定 / 不需要）：\n  备注：\n  \U0001F468 无异议。参考文献标题、条目样式、编号示例和\
    \ GB/T 7714-2005 依据均有原始 DOCX 证据。\n\n3.8 模板默认页保留策略\n  附录：\n    - 学校模板标注“此项非必需项”，但草稿/审阅输出默认保留。\n\
    \    - 无学生内容时保留标题和人工确认占位。\n  相关的学术成果目录：\n    - 学校模板标注“此项非必需项”，但草稿/审阅输出默认保留。\n\
    \    - 无学生内容时保留标题和人工确认占位。\n  致谢：\n    - 学校模板写“一般应放置致谢”，因此默认保留。\n    - 无学生内容时保留标题和人工确认占位。\n\
    \  说明文字：\n    - 源模板中用于指导写作的说明段落不是最终论文固定正文。\n    - 说明段落可作为审查证据，但最终输出应由学生内容或占位替换。\n\
    \  判定（匹配 / 不匹配 / 不确定 / 不需要）：\n  备注：\n  \U0001F468 无异议。附录、相关学术成果目录为“此项非必需项”，致谢为“一般应放置”；草稿保留、正式人工确认删除的策略符合源模板。\n\
    \n3.9 同页约束与分页完整性\n  适用对象：\n    - 封面整体模块。\n    - 固定声明/授权页的签名区。\n    - 标题与紧随其后的第一段或第一项内容。\n\
    \    - 学校模板中明确要求同页呈现的表单、勾选项、底部说明或签名日期。\n    - 图题/表题组同页规则：源模板未明示；如产品共享默认规则需要，可在共享层补充，不写成南农本校事实。\n\
    \  审查原则：\n    - 同页约束是单元/元素的布局属性，不是单纯样式属性。\n    - 如果同页约束失败，应记为版面完整性问题。\n    - 不应为了通过分页而删除固定元素，也不应把同一固定表单拆成多个逻辑单元。\n\
    \  Word 实现提示：\n    - 普通段落可使用“与下段同页”“段中不分页”。\n    - 固定表单和封面可优先保留为整体表格、内容控件或模板块。\n\
    \    - 图题/表题是否使用 keep-with-next，属于共享默认或渲染策略，需要单独标注来源。\n    - 如果内容本身超过一页，应保留学校模板结构并输出人工调整提示。\n\
    \  判定（匹配 / 不匹配 / 不确定 / 不需要）：\n  备注：\n  \U0001F468 已修改：删除把图题/表题同页约束写成南农源模板事实的表述；同页规则保留在封面、声明签名区、标题与首段等可确认对象上，图表同页可由共享默认规则另行补充。\n\
    \n================================================================================\n\
    4. 实现对齐提醒\n================================================================================\n\
    \n4.1 单元顺序对齐\n  官方源模板可见顺序为“目录 -> 中文摘要 -> 英文摘要”，当前审查按此顺序。\n  现有 school.yaml/template_manifest\
    \ 中存在“摘要 -> 目录”的工程化顺序迹象，需要后续实现确认并对齐。\n\n4.2 页眉页脚距离对齐\n  源模板 OOXML 的正文页眉/页脚距离约为\
    \ 15mm/17.5mm；当前 school.yaml 顶层 page.header_mm/footer_mm 为 5mm。\n  如果最终以源模板为准，运行时\
    \ section 生成不能只使用统一 5mm。\n\n4.3 前置页页码大小写\n  源模板存在大写罗马页码证据，school.yaml 当前写 lowerRoman。\n\
    \  需要人工确认学校最终要求大写罗马还是小写罗马；确认前测试只应断言“前置页为罗马页码，正文为阿拉伯数字页码”。\n\n4.4 图目录/表目录\n  南农官方模板没有独立图目录/表目录页。\n\
    \  不应在本校审查里直接列为南农模板单元；若未来中国通用规范要求，可作为默认配置另行加入，并标注不是源模板证据。\n\n4.5 图表样例不足\n  源模板只有图表规则说明，没有提供真实图、表样例。\n\
    \  目前可审查图表单元顺序、双语标题、编号、位置和样式；三线表边框、复杂表注、跨页续表等细节需要后续样本或人工补证。\n\n4.6 其他高风险非样式约束\n\
    \  固定模板隐藏结构：\n    - 封面是整体表格/模板块，声明和授权页有固定签名日期区；合成时不能只复制可见文字而丢掉表格、字段、签名线或占位结构。\n\
    \  生成字段：\n    - 目录必须保留 Word TOC 字段；目录可见页码可能是旧结果，不能把旧结果当成固定文本。\n    - 页码应由页脚字段或等价机制生成，不能手打成普通正文。\n\
    \  单元边界：\n    - 参考文献必须在“附录/相关的学术成果目录/致谢”之前结束，不能吞掉后置页。\n    - 目录条目里的“第一章”“参考文献”“附录”等不能被误识别为正文标题。\n\
    \  段内混排：\n    - 中文“关键词：”与关键词内容同段但 run 样式不同。\n    - 英文“KEY WORDS:”与英文关键词内容同段但 run\
    \ 样式不同。\n    - 不能只给整段一个统一样式后忽略标签与内容的差异。\n  无页眉/无页码也是规则：\n    - 封面、声明、授权、目录、中英文摘要默认无页眉；封面、声明、授权不显示页码。\n\
    \    - 这些“空”不是缺失，应该进入验证。\n  新页与分节：\n    - 单元要求“另起页”时，不一定要新建 section；只有页眉页脚、页码格式、页边距等\
    \ section 级属性变化时才需要新 section。\n  渲染预检：\n    - 同页约束、封面溢出、签名区掉页、孤立表题/图题，必须通过渲染后页面级检查或人工\
    \ review 标记确认。\n\n================================================================================\n\
    5. 本校总评\n================================================================================\n\
    \n5.1 当前审查口径\n  南京农业大学本科模板可以按“单元 -> 元素 -> 子元素/嵌套单元”建模。\n  封面、声明、授权、目录属于学校模板/系统拥有的固定或生成单元；摘要、正文、参考文献、附录、成果目录、致谢属于学生内容填充到学校模板槽位。\n\
