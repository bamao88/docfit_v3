    \ linePitch=326\n  默认段落：默认对齐=两端对齐；默认字号=12pt（小四）；字符间距控制=压缩标点\n  判定（匹配 / 不匹配 / 不确定\
    \ / 不需要）：\n  备注：\n  \U0001F468 无异议。常规页边距、页眉/页脚距离、横向页边距和文档网格均来自原始 DOCX section\
    \ 设置；section 只在页面属性变化时切换。\n\n3.2 页码\n  归属：这里只记录跨单元共享的页码格式、字体字号和编号连续性；每个单元只标明采用前置页规则或正文/后置页规则。\n\
    \  前置页：页脚居中；Times New Roman；10.5pt（五号）；大写罗马数字；中文摘要起始页为 I\n  正文及所有后置页：页脚居中；Times\
    \ New Roman；10.5pt（五号）；阿拉伯数字页码；从正文首页起始并连续编号。后置页包括参考文献、附录、致谢、原创性声明和使用授权说明等。\n \
    \ Word section 规则：从前置页切到正文页码时新开 section，并将正文页码格式设为阿拉伯数字、起始页为 1；后置页沿用正文页码并继续编号，除非页眉或版式变化需要新\
    \ section。\n  页脚段落设置：对齐到文档网格=否；其余高级项默认/继承，需 Word 核对。\n  判定（匹配 / 不匹配 / 不确定 / 不需要）：\n\
