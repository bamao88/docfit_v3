    \ 中文与西文间距\n    - 中文与数字间距\n    - 允许西文在单词中间换行\n  规则：如果某个单元或元素有特别设置，写在对应单元；这里只记录全局需要关注的项目。\n\
    \  判定（匹配 / 不匹配 / 不确定 / 不需要）：\n  备注：\n  \U0001F468 无异议。这里记录的是需要逐元素关注的高级项清单，具体开关仍落在各元素样式或源\
