  school_id: pku-graduate
  source_section_sha256: sha256:c4067e225d83e45fc96b9ae82f6a222f6315c8d32ff7c7618d2fc21cb8ea4638
  review_packet_sha256: sha256:afd5d042b9a6e20102571b7ccbe59ecfe415049350ad3aa94e9cc2977854369c
  stage_model: 00_input_request -> 01_source_parse -> 02_structure_discovery -> 03_generation_model -> 04_plan_build -> 05_action_execution -> 06_final_template_gap
  unit_tree_source: template_unit_contract.yaml#/expected/units
