    - fill
    - fixed
    source_refs:
    - review_text:1.10
    - review_text:2.10
    handling: 默认保留学校模板中的附录成果模块；填成果条目；无内容时保留标题、成果类别、占位和评论。
  - unit_id: acknowledgement
    name: 致谢
    order: 11
    status: template_default
    policy: fixed
    element_count: 2
    element_policies:
    - fill
    - fixed
    source_refs:
    - review_text:1.11
    - review_text:2.11
    handling: 默认保留学校模板中的致谢模块；填致谢正文；无内容时保留标题、占位和评论。
  - unit_id: originality_authorization_statement
    name: 北京大学学位论文原创性声明和使用授权说明
