  policy_groups:
    manual_only_units:
    - copyright_notice
    - originality_authorization_statement
    fillable_units:
    - abstract_cn
    - abstract_en
    - body_main
    - references
    - academic_achievements
    - acknowledgement
    generated_units:
    - toc
    - figure_list
    - table_list
    - body_main
    template_default_units:
    - academic_achievements
    - acknowledgement
    fixed_or_protected_units:
    - cover
    - copyright_notice
    - abstract_cn
    - abstract_en
    - toc
    - figure_list
    - table_list
    - body_main
    - references
    - academic_achievements
    - acknowledgement
    - originality_authorization_statement
  stage_boundaries:
  - stage_id: 01_source_parse
    artifact: source_template_tree.json
    input_artifacts:
    - template_generation_request.json
    - 00_input_source_template.docx
    output_artifacts:
    - source_template_tree.json
    checks_against_review:
    - 源模板可见段落、表格、页眉页脚、分节和未知对象必须保留为事实证据
    - 每个后续可引用的可见节点必须有稳定 source_seq/source_ref
    - 源文件 hash 必须绑定到 signed_standard.source.template_docx_sha256
    not_allowed:
    - 不得在本阶段裁定 unit_id、policy 或最终生成策略
    - 不得删除人工 review 中后续需要判断的可见模板事实
    missing_or_unreadable_result: UNKNOWN
  - stage_id: 02_structure_discovery
    artifact: template_structure_candidates.json
    input_artifacts:
    - source_template_tree.json
    output_artifacts:
    - template_structure_candidates.json
    checks_against_review:
    - 候选 unit 顺序必须能覆盖人工 review 的 expected.unit_order
    - logical element 必须保留 source_seq_refs，合并关系必须可追溯
    - 固定、填充、生成、manual_only、template_default_optional 的角色提示必须来自源模板证据
    not_allowed:
    - 不得把学校说明文字当作学生正文候选
    - 不得把 manual_only 固定表单误标成学生内容 slot
    - 不得把缺证据的启发式写成已验收结论
    missing_or_unreadable_result: UNKNOWN
  - stage_id: 03_generation_model
    artifact: template_generation_model.json
    input_artifacts:
    - template_generation_request.json
    - template_structure_candidates.json
    output_artifacts:
    - template_generation_model.json
    checks_against_review:
    - unit 策略必须保持人工 review 的单元顺序、status、policy 和处理口径
    - manual_only/fixed/template_default 单元必须被保护或保留，不得静默删除
    - 学生内容、元数据、Word 生成字段和人工填写区域必须区分
    not_allowed:
    - 不得读取学校标准作为 template-generate 正常业务输入
    - 不得用某次学生内容决定学校模板单元是否存在
    - 不得用 manifest 或模型替代最终 gap 判断
    missing_or_unreadable_result: UNKNOWN
  - stage_id: 04_plan_build
    artifact: template_generation_plan.json
    input_artifacts:
    - template_generation_model.json
    output_artifacts:
    - template_generation_plan.json
    checks_against_review:
    - 每个修改型 action 必须声明 affected_source_seq_refs
    - cleanup action 只能处理人工 review 允许剥离的说明文字或示例痕迹
    - 字段、目录、图目录、表目录、页眉页码等生成动作必须能回到人工 review 的对应单元
    not_allowed:
    - 不得生成无法回溯来源的删除、替换或 slot action
    - 不得把 copy-only/protected 单元拆成普通正文动作
    missing_or_unreadable_result: UNKNOWN
  - stage_id: 05_action_execution
    artifact: generated_template.docx + template_generation_manifest.json
    input_artifacts:
    - 00_input_source_template.docx
    - template_generation_plan.json
    output_artifacts:
    - 05.0_copy_source_docx.docx
    - generated_template.docx
    - template_generation_manifest.json
    checks_against_review:
    - manifest 必须记录执行动作、输入输出 hash 和 affected_source_seq_refs
    - 生成 Word 必须先能作为 DOCX 打开并进入 06_final_template_gap
    - 固定模板块、人工表单和签名日期区必须按人工 review 的保留策略处理
    not_allowed:
    - 不得把生成命令执行成功当成最终模板合格
    - 不得在缺 manifest/hash 时用重新生成补旧 run 的证据
    missing_or_unreadable_result: UNKNOWN
  stage_standards:
    01_source_parse:
      standard_state: signed_pending_verifier
      verifier_state: not_configured
      gate_enabled: false
      expected_from_review:
        source_template_hash_bound: true
        visible_source_facts_required:
        - paragraphs
        - tables
        - headers_footers
        - sections
        - fields
        - numbering_definitions
        - unknown_objects
        stable_locator_fields:
        - source_seq
        - source_seq_refs
        - source_ref
    02_structure_discovery:
      standard_state: signed_pending_verifier
      verifier_state: not_configured
      gate_enabled: false
      expected_from_review:
        required_unit_order:
        - cover
        - copyright_notice
        - abstract_cn
        - abstract_en
        - toc
        - figure_list
        - table_list
        - body_main
        - references
        - academic_achievements
        - acknowledgement
        - originality_authorization_statement
        policy_groups:
          manual_only_units:
          - copyright_notice
          - originality_authorization_statement
          fillable_units:
          - abstract_cn
          - abstract_en
          - body_main
          - references
          - academic_achievements
          - acknowledgement
          generated_units:
          - toc
          - figure_list
          - table_list
          - body_main
          template_default_units:
          - academic_achievements
          - acknowledgement
          fixed_or_protected_units:
          - cover
          - copyright_notice
          - abstract_cn
          - abstract_en
          - toc
          - figure_list
          - table_list
          - body_main
          - references
          - academic_achievements
          - acknowledgement
          - originality_authorization_statement
        candidate_trace_fields:
        - source_seq_refs
        - role_hint
        - evidence
    03_generation_model:
      standard_state: signed_pending_verifier
      verifier_state: not_configured
      gate_enabled: false
      expected_from_review:
        required_unit_strategies:
        - unit_id: cover
          status: required
          policy: fixed
          handling: 当前阶段保留学校封面模块；不填任何封面字段；不做字段文字锚点匹配。
        - unit_id: copyright_notice
          status: manual_only
          policy: manual_only
          handling: 保留固定页；不自动填充。
        - unit_id: abstract_cn
          status: required
          policy: fixed
          handling: 保留标题和关键词标签；填入中文摘要、中文关键词。
        - unit_id: abstract_en
          status: required
          policy: fixed
          handling: 填英文题名、作者、导师、英文摘要、英文关键词；固定英文标题和标签。
        - unit_id: toc
          status: required
          policy: fixed
          handling: 使用 Word 目录字段生成。
        - unit_id: figure_list
          status: required
          policy: fixed
          handling: 默认保留图目录页；有图题时生成条目；未识别到图题时保留空白图目录页并添加人工评论。
        - unit_id: table_list
          status: required
          policy: fixed
          handling: 默认保留表目录页；有表题时生成条目；未识别到表题时保留空白表目录页并添加人工评论。
        - unit_id: body_main
          status: required
          policy: fixed
          handling: 按学校模板保留章、节、正文、图、表、公式等规则；包含最后固定章“结论与讨论”。
        - unit_id: references
          status: required
          policy: fixed
          handling: 保留标题；填参考文献条目。
        - unit_id: academic_achievements
          status: template_default
          policy: fixed
          handling: 默认保留学校模板中的附录成果模块；填成果条目；无内容时保留标题、成果类别、占位和评论。
        - unit_id: acknowledgement
          status: template_default
          policy: fixed
          handling: 默认保留学校模板中的致谢模块；填致谢正文；无内容时保留标题、占位和评论。
        - unit_id: originality_authorization_statement
          status: manual_only
          policy: manual_only
          handling: 保留固定签名/授权页；不自动填充。
        must_distinguish_policy_groups:
          manual_only_units:
          - copyright_notice
          - originality_authorization_statement
          fillable_units:
          - abstract_cn
          - abstract_en
          - body_main
          - references
          - academic_achievements
          - acknowledgement
          generated_units:
          - toc
          - figure_list
          - table_list
          - body_main
          template_default_units:
          - academic_achievements
          - acknowledgement
          fixed_or_protected_units:
          - cover
          - copyright_notice
          - abstract_cn
          - abstract_en
          - toc
          - figure_list
          - table_list
          - body_main
          - references
          - academic_achievements
          - acknowledgement
          - originality_authorization_statement
    04_plan_build:
      standard_state: signed_pending_verifier
      verifier_state: not_configured
      gate_enabled: false
      expected_from_review:
        required_action_trace_fields:
        - affected_source_seq_refs
        - unit_id
        - action_type
        cleanup_requires_review_basis: true
        protected_unit_ids:
        - copyright_notice
        - originality_authorization_statement
    05_action_execution:
      standard_state: signed_pending_verifier
      verifier_state: not_configured
      gate_enabled: false
      expected_from_review:
        required_outputs:
        - generated_template.docx
        - template_generation_manifest.json
        - 05.0_copy_source_docx.docx
        manifest_must_bind_hashes: true
        manifest_must_preserve_source_refs: true
        final_quality_gate: 06_final_template_gap
dimensions:
- dimension_id: template_generation_stage.source_section_hash
  required: true
  comparator_mode: exact
  expected_path: source_section_sha256
  actual_path: source_section_sha256
- dimension_id: template_generation_stage.stage_model
  required: true
  comparator_mode: exact
  expected_path: stage_model
  actual_path: stage_model
- dimension_id: template_generation_stage.unit_order
  required: true
  comparator_mode: ordered_sequence
  expected_path: unit_order
  actual_path: unit_order
