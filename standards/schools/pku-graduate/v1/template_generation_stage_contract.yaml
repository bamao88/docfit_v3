    - review_text:2.1
    handling: 当前阶段保留学校封面模块；不填任何封面字段；不做字段文字锚点匹配。
  - unit_id: copyright_notice
    name: 版权声明
    order: 2
    status: manual_only
    policy: manual_only
    element_count: 3
    element_policies:
    - manual_only
    source_refs:
    - review_text:1.2
    - review_text:2.2
    handling: 保留固定页；不自动填充。
  - unit_id: abstract_cn
    name: 中文摘要
    order: 3
    status: required
    policy: fixed
    element_count: 4
    element_policies:
    - fill
    - fixed
    source_refs:
    - review_text:1.3
    - review_text:2.3
    handling: 保留标题和关键词标签；填入中文摘要、中文关键词。
  - unit_id: abstract_en
    name: 英文摘要
    order: 4
    status: required
    policy: fixed
    element_count: 7
    element_policies:
    - fill
    - fixed
    source_refs:
    - review_text:1.4
    - review_text:2.4
    handling: 填英文题名、作者、导师、英文摘要、英文关键词；固定英文标题和标签。
  - unit_id: toc
    name: 目录
    order: 5
    status: required
    policy: fixed
    element_count: 5
    element_policies:
    - generated
    source_refs:
    - review_text:1.5
    - review_text:2.5
    handling: 使用 Word 目录字段生成。
  - unit_id: figure_list
    name: 图目录
    order: 6
    status: required
    policy: fixed
    element_count: 2
    element_policies:
    - generated
    source_refs:
    - review_text:1.6
    - review_text:2.6
    handling: 默认保留图目录页；有图题时生成条目；未识别到图题时保留空白图目录页并添加人工评论。
  - unit_id: table_list
    name: 表目录
    order: 7
    status: required
    policy: fixed
    element_count: 2
    element_policies:
    - generated
    source_refs:
    - review_text:1.7
    - review_text:2.7
    handling: 默认保留表目录页；有表题时生成条目；未识别到表题时保留空白表目录页并添加人工评论。
  - unit_id: body_main
    name: 正文主体
    order: 8
    status: required
    policy: fixed
    element_count: 27
    element_policies:
    - fill
    - fixed
    - generated
    source_refs:
    - review_text:1.8
    - review_text:2.8
    handling: 按学校模板保留章、节、正文、图、表、公式等规则；包含最后固定章“结论与讨论”。
  - unit_id: references
