    order: 12
    status: manual_only
    policy: manual_only
    element_count: 5
    element_policies:
    - manual_only
    source_refs:
    - review_text:1.12
    - review_text:2.12
    handling: 保留固定表单；不自动填文献综述、研究方案、论证小组意见、签名日期。
  - unit_id: proposal_record
