    order: 13
    status: manual_only
    policy: manual_only
    element_count: 4
    element_policies:
    - manual_only
    source_refs:
    - review_text:1.13
    - review_text:2.13
    handling: 保留固定记录表；不自动填写记录人、论证质疑、学生回答、签名日期。
  - unit_id: defense_record
    name: 答辩记录表
    order: 14
    status: manual_only
