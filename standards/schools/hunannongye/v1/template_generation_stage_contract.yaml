  unit_summaries:
  - unit_id: cover
    name: 封面
    order: 1
    status: required
    policy: fixed
    element_count: 7
    element_policies:
    - fill
    - fixed
    - manual_only
    source_refs:
    - review_text:1.1
    - review_text:2.1
    handling: 按固定模板块处理，可从源模板封面示例复制最终可见版面；不填任何封面字段；附件标题、括号格式说明和条件说明文字不进入最终输出。
  - unit_id: integrity_statement
    name: 诚信声明
    order: 2
    status: manual_only
    policy: manual_only
    element_count: 5
    element_policies:
    - manual_only
    source_refs:
    - review_text:1.2
    - review_text:2.2
    handling: 按固定模板块处理，可直接复制源模板诚信声明页；保留声明标题、正文、作者签名和日期空位，不自动填写签名和日期。
  - unit_id: toc
    name: 目录
    order: 3
    status: required
    policy: fixed
    element_count: 3
    element_policies:
    - fixed
    - generated
    source_refs:
    - review_text:1.3
    - review_text:2.3
    handling: 源模板目录是手写示例；目标输出可用 Word TOC 字段或等价目录生成机制生成目录；目录层级到 3 级。目录可跨多页；目录结束后，正文题名信息必须从下一页开始，不能接在目录最后一页空白处。
  - unit_id: body_title_block
    name: 正文题名信息
    order: 4
    status: required
    policy: fixed
    element_count: 4
    element_policies:
    - fill
    source_refs:
    - review_text:1.4
    - review_text:2.4
    handling: 保留中文题名、学生、指导老师、学院/学校地址等可见信息段落；当前阶段不自动填这些字段；不要求源模板存在 content controls。
  - unit_id: abstract_cn
    name: 中文摘要
    order: 5
    status: required
    policy: fixed
    element_count: 4
    element_policies:
    - fill
    - fixed
    source_refs:
    - review_text:1.5
    - review_text:2.5
    handling: 使用内嵌“摘  要：”标签和“关键词：”标签；填学生中文摘要和中文关键词；剥离源模板中的括号格式说明文字。
  - unit_id: abstract_en
    name: 英文摘要
    order: 6
    status: required
    policy: fixed
    element_count: 8
    element_policies:
    - fill
    - fixed
    source_refs:
    - review_text:1.6
    - review_text:2.6
    handling: 保留英文题名、Student、Tutor、英文学院/学校地址、Abstract 和 Key words 标签；填学生英文摘要和英文关键词；剥离源模板中的括号格式说明文字。
  - unit_id: body_main
    name: 正文主体
    order: 7
    status: required
    policy: fixed
    element_count: 12
    element_policies:
    - fill
    - fixed
    source_refs:
    - review_text:1.7
    - review_text:2.7
    handling: 按农理工类或文法经管类标题体系进入正文内容流；正文段落和标题按源模板规则处理；本校专属标准不定义图、表、公式的题名、编号、结构或样式。
  - unit_id: references
    name: 参考文献
    order: 8
    status: required
    policy: fixed
    element_count: 2
    element_policies:
    - fill
    - fixed
    source_refs:
    - review_text:1.8
    - review_text:2.8
    handling: 保留标题“参考文献”；填参考文献条目。
  - unit_id: acknowledgement
    name: 致谢
    order: 9
    status: template_default_optional
    policy: template_default_optional
    element_count: 2
    element_policies:
    - fill
    - template_default_optional
    source_refs:
    - review_text:1.9
    - review_text:2.9
    handling: 草稿/审阅输出默认保留；填学生致谢；无内容时保留标题、占位和评论。
  - unit_id: appendix
    name: 附录
    order: 10
    status: template_default_optional
    policy: template_default_optional
    element_count: 2
    element_policies:
    - fill
    - template_default_optional
    source_refs:
    - review_text:1.10
    - review_text:2.10
    handling: 源模板说明“没有附录的不标注”，但草稿/审阅输出可默认保留并提示学生确认；正式输出是否删除需人工确认。
  - unit_id: design_task
    name: 毕业设计任务书
    order: 11
    status: manual_only
    policy: manual_only
    element_count: 7
    element_policies:
    - manual_only
    source_refs:
    - review_text:1.11
    - review_text:2.11
    handling: 保留固定表单和填写说明；不自动填学生信息、课题来源勾选、进度安排、签名日期。
  - unit_id: proposal
